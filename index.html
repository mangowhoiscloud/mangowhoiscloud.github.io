<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Moved to mangowhois.ai</title>
<script>
function destination(input) {
  const url = new URL(input);
  const path = url.pathname.replace(/index\.html$/, '');
  const report = path.match(/^\/(eco2|geode)\/report(-en)?\.pdf$/);
  if (report) return `https://tech.mangowhois.ai/${report[1]}/report/${report[2] ? 'en' : 'ko'}.pdf` + url.search + url.hash;
  const jevPdf = path.match(/^\/geode\/(?:research|resaerch)\/jev-system1-offloading\/report-(ko|en)\.pdf$/);
  if (jevPdf) return `https://tech.mangowhois.ai/jev/system-1-offloading/${jevPdf[1]}.pdf` + url.search + url.hash;
  const research = path.match(/^\/geode\/(?:research|resaerch)(?:\/(geode|jev-system1-offloading|jevdb))?\/?$/);
  if (research) {
    const reader = { geode: 'geode/', 'jev-system1-offloading': 'jev/offloading/', jevdb: 'jev/jevdb/' }[research[1]] || '';
    return 'https://tech.mangowhois.ai/' + reader + url.search + url.hash;
  }
  const geode = path.match(/^\/geode(\/.*)?$/);
  const target = geode ? 'https://mangowhois.ai/products/geode' + (geode[1] || '/')
    : /^\/eco2(\/|$)/.test(path) ? 'https://mangowhois.ai/eco2/'
    : 'https://mangowhois.ai/';
  return target + url.search + url.hash;
}
location.replace(destination(location.href));
</script>
<style>html{background:#0b0b0c;color:#ecebe6;font:16px/1.5 system-ui,sans-serif}body{margin:0;padding:24px 16px}a{color:inherit}</style>
</head>

<li>GEODE report: <a href="https://tech.mangowhois.ai/geode/">Research reader</a></li>

</ul>
